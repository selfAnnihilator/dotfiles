## Zanken environment variables
## Loaded by systemd user environment (environment.d)

ZANKEN_PATH=%h/zanken
PATH=%h/.config/zanken/bin:%h/.local/bin:${PATH}

# XDG session
XDG_CURRENT_DESKTOP=niri
XDG_SESSION_DESKTOP=niri
XDG_SESSION_TYPE=wayland

# Cursor
XCURSOR_THEME=Brushbuddy
XCURSOR_SIZE=40

# Qt / Gtk / Electron Wayland hints
QT_QPA_PLATFORM=wayland
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
# Do not set GDK_BACKEND globally: it makes xdg-desktop-portal-gnome
# disable Niri's screen-cast picker.
SDL_VIDEODRIVER=wayland
CLUTTER_BACKEND=wayland
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
NIXOS_OZONE_WL=1

# Niri socket (set by niri at startup)
# NIRI_SOCKET is set automatically

# Editor / terminal
TERMINAL=foot
VISUAL=nvim
EDITOR=nvim
